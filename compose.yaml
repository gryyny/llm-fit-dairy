# OP-1: Caddy, app and PostgreSQL on one VPS. Values come from the root-only .env beside this file.
services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?}
      OAUTH_CHATGPT_CLIENT_SECRET_SHA256: ${OAUTH_CHATGPT_CLIENT_SECRET_SHA256:?}
      OAUTH_CHATGPT_REDIRECT_URIS: ${OAUTH_CHATGPT_REDIRECT_URIS:-https://chatgpt.com/connector_platform_oauth_redirect}
      OPENAI_APPS_CHALLENGE: ${OPENAI_APPS_CHALLENGE:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ./.secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ${IMPORT_DIR:?}:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  postgres:
    image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    restart: unless-stopped
    environment:
      POSTGRES_USER: diary
      POSTGRES_DB: diary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
