# OP-4: the one gate on every push to main. It never deploys.
name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: diary
          POSTGRES_PASSWORD: diary
          POSTGRES_DB: diary_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diary" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://diary:diary@127.0.0.1:5432/diary_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
